<h1>街角咖啡 Q3 營運分析</h1>
<p>本季營收較上季成長 18%，主要來自新推出的燕麥拿鐵與週末早午餐套餐。</p>

<h2>營收概況</h2>
<p>七到九月總營收約 <b>新台幣 320 萬元</b>，客單價由 165 元提升至 182 元。來客數持平，成長主要來自加購率提升。</p>
<table>
  <tr><th>月份</th><th>營收（萬元）</th><th>來客數</th></tr>
  <tr><td>七月</td><td>98</td><td>5,900</td></tr>
  <tr><td>八月</td><td>104</td><td>5,750</td></tr>
  <tr><td>九月</td><td>118</td><td>6,100</td></tr>
</table>
<div class="chart"><div class="bar" style="height:62%"></div><div class="bar" style="height:68%"></div><div class="bar" style="height:80%"></div></div>
<p class="note">圖：七至九月營收趨勢</p>

<h2>建議</h2>
<p>建議第四季延長早午餐供應時段至下午兩點，並將燕麥奶選項擴及所有咖啡品項。</p>
